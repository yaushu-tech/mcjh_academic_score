<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 GitHub Pages 網頁</title>
</head>
<body>
    <h1>從 Google Sheets 讀取的資料：</h1>
    <div id="loading">資料載入中，請稍候...</div>
    <ul id="data-list"></ul>

    <script>
        // 將這裡替換成你剛剛複製的 GAS 網址
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbzCdjRDJ5WdZNkBLRh6nY9jkOQ8GOGip2kbRKOXoQ0Upa3I69ZKPRstVTsZx0bxFAJz/exec';

        // 呼叫 API 取得資料
        fetch(scriptUrl)
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none'; // 隱藏載入中文字
                
                const list = document.getElementById('data-list');
                // 假設 data 是一個二維陣列
                data.forEach((row, index) => {
                    // 略過第一行的標題
                    if (index > 0) {
                        let li = document.createElement('li');
                        li.textContent = `欄位1: ${row[0]} | 欄位2: ${row[1]}`;
                        list.appendChild(li);
                    }
                });
            })
            .catch(error => {
                console.error('發生錯誤:', error);
                document.getElementById('loading').innerText = '資料載入失敗！';
            });
    </script>
</body>
</html>
